<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trusted-Origin Policy Configuration</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  input:checked + .toggle-bg { background-color: #22d3ee; }
  input:checked + .toggle-bg .toggle-dot { transform: translateX(16px); }
</style>
</head>
<body class="bg-[#0b0f14] min-h-screen flex text-slate-300">

  <!-- Sidebar -->
  <aside class="w-56 shrink-0 bg-[#0b0f14] border-r border-slate-800 py-6 px-4 flex flex-col gap-1">
    <nav class="flex flex-col gap-1 text-sm">
      <a class="flex items-center gap-3 px-3 py-2 rounded-md text-slate-400 hover:bg-slate-800/40">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h7v7H3V3zm11 0h7v7h-7V3zM3 14h7v7H3v-7zm11 0h7v7h-7v-7z"/></svg>
        Dashboard
      </a>
      <a class="flex items-center gap-3 px-3 py-2 rounded-md text-slate-400 hover:bg-slate-800/40">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg>
        Security
      </a>
      <a class="flex items-center gap-3 px-3 py-2 rounded-md bg-slate-800/60 text-white">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg>
        Settings
      </a>
      <a class="flex items-center gap-3 px-3 py-2 rounded-md text-slate-400 hover:bg-slate-800/40">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Logs
      </a>
      <a class="flex items-center gap-3 px-3 py-2 rounded-md text-slate-400 hover:bg-slate-800/40">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.09 9a3 3 0 115.83 1c0 2-3 2-3 4m0 4h.01"/></svg>
        Help
      </a>
    </nav>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col">
    <!-- Top bar -->
    <div class="flex justify-end items-center gap-4 px-6 py-4 border-b border-slate-800">
      <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
      <div class="w-8 h-8 rounded-full bg-slate-600"></div>
    </div>

    <div class="px-6 py-6">
      <div class="flex items-center gap-3 mb-6">
        <svg class="w-6 h-6 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg>
        <h1 class="text-white text-2xl font-semibold">Trusted-Origin Policy Configuration</h1>
        <span class="flex items-center gap-1.5 text-xs font-medium text-emerald-400 bg-emerald-950/50 border border-emerald-800/60 rounded-full px-3 py-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          POLICY ACTIVE — ENFORCING
        </span>
      </div>

      <div class="flex gap-6 items-start">
        <!-- Left column -->
        <div class="flex-1">
          <!-- Add new origin -->
          <div class="bg-[#12171f] border border-slate-800 rounded-lg p-5 mb-6">
            <h2 class="text-xs font-semibold tracking-wide text-slate-400 mb-3">ADD NEW ORIGIN</h2>
            <div class="flex gap-3 items-start">
              <div class="flex-1">
                <input placeholder="Enter Domain/Origin (e.g., api.example.com or http://lo"
                  class="w-full bg-[#0b0f14] border border-slate-700 rounded-md px-3 py-2.5 text-sm text-slate-300 placeholder-slate-500 focus:outline-none focus:border-cyan-600">
                <p class="text-xs text-slate-500 mt-1.5">Whitelist + ACTIVE — Enforcing</p>
              </div>
              <div>
                <select class="bg-[#0b0f14] border border-slate-700 rounded-md px-3 py-2.5 text-sm text-slate-300 focus:outline-none">
                  <option>HTTP</option>
                  <option>HTTPS</option>
                </select>
                <p class="text-xs text-slate-500 mt-1.5">Protocol</p>
              </div>
              <div>
                <input placeholder="Port (optional)"
                  class="w-32 bg-[#0b0f14] border border-slate-700 rounded-md px-3 py-2.5 text-sm text-slate-300 placeholder-slate-500 focus:outline-none">
                <p class="text-xs text-slate-500 mt-1.5">Port (optional)</p>
              </div>
              <button class="bg-cyan-400 hover:bg-cyan-300 text-slate-900 font-semibold text-sm rounded-md px-4 py-2.5 whitespace-nowrap">ADD ENTRY</button>
            </div>
          </div>

          <!-- Table -->
          <div class="bg-[#12171f] border border-slate-800 rounded-lg overflow-hidden">
            <table class="w-full text-sm">
              <thead>
                <tr class="text-slate-400 text-left border-b border-slate-800">
                  <th class="px-5 py-3 font-medium">Domain Name</th>
                  <th class="px-5 py-3 font-medium">Protocol</th>
                  <th class="px-5 py-3 font-medium">Port</th>
                  <th class="px-5 py-3 font-medium">Status</th>
                  <th class="px-5 py-3 font-medium text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="origin-rows" class="divide-y divide-slate-800"></tbody>
            </table>
          </div>
        </div>

        <!-- Right: JSON preview -->
        <div class="w-96 shrink-0 bg-[#0b1720] border border-slate-800 rounded-lg overflow-hidden">
          <div class="px-4 py-3 border-b border-slate-800">
            <h2 class="text-xs font-semibold tracking-wide text-slate-400">POLICY CONFIGURATION PREVIEW (JSON)</h2>
          </div>
          <pre class="mono text-[12.5px] leading-6 px-4 py-4 text-cyan-200 overflow-x-auto" id="json-preview"></pre>
        </div>
      </div>
    </div>
  </div>

<script>
const origins = [
  { domain: "*.example.com", icon: "globe", protocol: "HTTPS", port: "443", enabled: true },
  { domain: "api.internal.network", icon: "globe", protocol: "HTTPS", port: "*", enabled: true },
  { domain: "developer-portal.dev", icon: "bolt", protocol: "HTTP", port: "8080", enabled: false },
  { domain: "storage.services.cloud", icon: "cloud", protocol: "HTTPS", port: "443", enabled: true },
  { domain: "auth.corp.org", icon: "globe", protocol: "HTTPS", port: "443", enabled: true },
];

const icons = {
  globe: `<svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12h18M12 3c2.5 2.5 3.5 6 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-6-3.5-9s1-6.5 3.5-9z"/></svg>`,
  bolt: `<svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>`,
  cloud: `<svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h10a4 4 0 000-8 5 5 0 00-9.6-1.8A4 4 0 003 15z"/></svg>`,
};

const tbody = document.getElementById("origin-rows");
origins.forEach((o, i) => {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td class="px-5 py-3.5 flex items-center gap-2.5 text-slate-200">${icons[o.icon]}${o.domain}</td>
    <td class="px-5 py-3.5 text-slate-300">${o.protocol}</td>
    <td class="px-5 py-3.5 text-slate-300">${o.port}</td>
    <td class="px-5 py-3.5">
      <span class="flex items-center gap-2 text-xs font-semibold ${o.enabled ? 'text-cyan-300' : 'text-slate-500'}">
        ${o.enabled ? 'ENABLED' : 'DISABLED'}
        <label class="relative inline-block w-9 h-5">
          <input type="checkbox" class="sr-only" ${o.enabled ? "checked" : ""}>
          <span class="toggle-bg absolute inset-0 rounded-full ${o.enabled ? 'bg-cyan-400' : 'bg-slate-700'} transition-colors">
            <span class="toggle-dot absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full transition-transform" style="${o.enabled ? 'transform:translateX(16px)' : ''}"></span>
          </span>
        </label>
      </span>
    </td>
    <td class="px-5 py-3.5 text-right">
      <button class="text-slate-500 hover:text-rose-400">
        <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 7h12M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m2 0v12a2 2 0 01-2 2H8a2 2 0 01-2-2V7h12z"/></svg>
      </button>
    </td>
  `;
  tbody.appendChild(tr);
});

const json = {
  status: "active",
  version: "1.4.2",
  trustedOrigins: origins.map(o => ({
    domain: o.domain,
    protocol: o.protocol.toLowerCase(),
    port: o.port === "*" ? "a" : (isNaN(o.port) ? o.port : Number(o.port)),
    enabled: o.enabled,
  })),
};
document.getElementById("json-preview").textContent = JSON.stringify(json, null, 2);
</script>
</body>
</html>
